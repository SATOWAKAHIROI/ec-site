services:
  # ---------------------------------------------
  # MySQL（データベース）
  # ---------------------------------------------
  db:
    image: mysql:8.4
    container_name: ec-site-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ecsite
      MYSQL_USER: ecuser
      MYSQL_PASSWORD: ecpass
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # ホストのDBクライアント（DBeaver等）から接続する用
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------
  # Spring Boot アプリ（ホストにJDKを入れずコンテナ内でビルド・実行）
  # ---------------------------------------------
  app:
    image: eclipse-temurin:21-jdk
    container_name: ec-site-app
    working_dir: /workspace
    command: ["./gradlew", "bootRun", "--no-daemon"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ecsite
      DB_USER: ecuser
      DB_PASSWORD: ecpass
      GRADLE_USER_HOME: /workspace/.gradle-home
      TZ: Asia/Tokyo
    volumes:
      - ./:/workspace
      - gradle-cache:/workspace/.gradle-home
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------
  # Next.js フロントエンド（ホストにNode.jsを入れずコンテナ内で実行）
  # ---------------------------------------------
  frontend:
    image: node:22
    container_name: ec-site-frontend
    working_dir: /app
    # Turbopackは/mnt/c上のファイル変更を検知できないため、
    # ポーリング監視（WATCHPACK_POLLING）が効くwebpackで起動する
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 --webpack"
    environment:
      # ブラウザから叩くAPIのURL（コンテナ名ではなくホスト側のURL）
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_BASE_URL: http://app:8080
      # WSL上のマウントではファイル変更を検知できないためポーリングを有効にする
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      TZ: Asia/Tokyo
    volumes:
      - ./frontend:/app
      # ホスト側のnode_modulesで上書きされないように匿名ボリュームを割り当てる
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  mysql-data:
  gradle-cache:
